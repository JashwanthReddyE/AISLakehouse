[project]
name = "aislakehouse"
version = "0.1.0"
description = "Real-time maritime behavior lakehouse — Week 1 ingestion (AISStream -> Event Hubs -> bronze Delta)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "azure-eventhub>=5.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion", "silver", "silver.reference", "gold"]

[tool.setuptools.package-data]
"silver.reference" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Databricks notebook source: relies on runtime-injected globals (spark, dbutils).
extend-exclude = ["databricks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
